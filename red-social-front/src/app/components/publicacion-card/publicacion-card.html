<div class="card">

    <img
        class="imagen-publicacion"
        [src]="imagen"
        alt="publicacion">

    <div class="contenido">

        <h2>
            {{ titulo }}
        </h2>

        <p>
            {{ descripcion }}
        </p>

        <div class="footer">

            <span class="likes">
                ❤️ {{ likes.length }}
            </span>

        </div>

    </div>

</div>
