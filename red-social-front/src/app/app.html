<app-navbar></app-navbar>
<router-outlet></router-outlet>
@if(mostrarModalSesion){

    <div class="modal-overlay">

        <div class="modal-sesion">

            <h2>
                Sesión próxima a vencer
            </h2>

            <p>
                Tu sesión vencerá pronto.
                ¿Deseás extenderla?
            </p>

            <div class="acciones-modal">

            <button
                (click)="extenderSesion()">

                Sí

            </button>

            <button
                (click)="cerrarSesionPorVencimiento()">

                No

            </button>

            </div>

        </div>

    </div>

}
