
<div class="contenedor">

    <h2>Dashboard de Usuarios</h2>

    <table>

        <thead>

            <tr>

                <th>Nombre</th>
                <th>Apellido</th>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Perfil</th>
                <th>Estado</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let usuario of usuarios">

                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.apellido }}</td>
                <td>{{ usuario.usuario }}</td>
                <td>{{ usuario.correo }}</td>
                <td>{{ usuario.perfil }}</td>

                <td>

                    <span *ngIf="usuario.activo">
                        Activo
                    </span>

                    <span *ngIf="!usuario.activo">
                        Deshabilitado
                    </span>

                </td>

                <td>

                    <button
                        *ngIf="usuario.activo"
                        (click)="deshabilitar(usuario._id)"
                    >
                        Deshabilitar
                    </button>

                    <button
                        *ngIf="!usuario.activo"
                        (click)="habilitar(usuario._id)"
                    >
                        Habilitar
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
