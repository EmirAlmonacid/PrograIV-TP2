<div class="contenedor">

    <div class="acciones">

        <button
            [class.activo]="orden === 'fecha'"
            (click)="ordenarPorFecha()">
            Más recientes
        </button>

        <button
            [class.activo]="orden === 'likes'"
            (click)="ordenarPorLikes()">
            Más populares
        </button>

    </div>

    @for (publicacion of publicaciones; track publicacion._id) {

        <app-publicacion-card
            [titulo]="publicacion.titulo"
            [descripcion]="publicacion.descripcion"
            [imagen]="publicacion.imagen"
            [likes]="publicacion.likes">
        </app-publicacion-card>

    }

</div>
