<div class="contenedor">

    <div class="cabecera">

        <h1>Publicaciones</h1>

        <button
            class="btn-nueva-publicacion"
            (click)="abrirModal()">
            + Nueva publicación
        </button>

    </div>

    <div class="acciones">

        <button
            [class.activo]="orden === 'fecha'"
            (click)="ordenarPorFecha()">
            Más recientes
        </button>

        <button
            [class.activo]="orden === 'likes'"
            (click)="ordenarPorLikes()">
            Más populares
        </button>

    </div>

    <div class="contenido-principal">

        <div class="feed">

            @for (publicacion of publicaciones; track $index) {

                <app-publicacion-card
                    [id]="publicacion._id"
                    [titulo]="publicacion.titulo"
                    [descripcion]="publicacion.descripcion"
                    [imagen]="publicacion.imagen"
                    [likes]="publicacion.likes"
                    [comentarios]="publicacion.comentarios"
                    [usuarioId]="publicacion.usuarioId">
                </app-publicacion-card>

            }

        </div>

        <aside class="sidebar">

            <div class="sidebar-card">

                <h3>Nuevos miembros</h3>

                @for(usuario of usuariosRecientes; track usuario._id){

                    <div class="usuario-item">

                        <img
                            [src]="usuario.foto"
                            alt="usuario">

                        <div>

                            <strong>
                                {{ usuario.nombre }}
                                {{ usuario.apellido }}
                            </strong>

                            <span>&#64;{{ usuario.usuario }}</span>

                        </div>

                    </div>

                }

            </div>

        </aside>

    </div>

    @if(mostrarModal){

        <div class="modal-overlay">

            <div class="modal-publicacion">

                <h2>Crear publicación</h2>

                <span class="subtitle">
                    Compartí algo con la comunidad.
                </span>

                <div class="field">

                    <label>Título</label>

                    <input
                        type="text"
                        [(ngModel)]="titulo">

                </div>

                <div class="field">

                    <label>Descripción</label>

                    <textarea
                        [(ngModel)]="descripcion"></textarea>

                </div>

                <div class="field">

                    <label>Imagen</label>

                    <label class="upload-box">

                        <input
                            #fileInput
                            type="file"
                            accept="image/*"
                            hidden
                            (change)="seleccionarImagen($event)">

                        <div
                            class="upload-icon"
                            (click)="fileInput.click()">
                            📎
                        </div>

                        <div class="upload-content">

                            <span class="upload-title">

                                @if(imagenSeleccionada){

                                    {{ imagenSeleccionada.name }}

                                } @else {

                                    Seleccionar imagen

                                }

                            </span>

                            <small>JPG, PNG o WEBP — máx. 5 MB</small>

                        </div>

                    </label>

                </div>

                <div class="modal-actions">

                    <button
                        class="btn-cancelar"
                        (click)="cerrarModal()">
                        Cancelar
                    </button>

                    <button
                        class="btn-publicar"
                        (click)="crearPublicacion()">
                        Publicar
                    </button>

                </div>

            </div>

        </div>

    }

</div>
